<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription — création de l'espace cabinet — CardioConsult (template)</title>
<link rel="icon" href="assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0A1F44}
a{color:#0B4FB3}a:hover{color:#083A85}
input:focus{outline:3px solid #9DBCF0;outline-offset:1px}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="min-height: 980px; display: flex; flex-wrap: wrap; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0A1F44; background: #F4F7FC">

<aside style="flex: 1 1 340px; max-width: 460px; background: #0A1F44; color: #FFFFFF; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
<img src="assets/logo-sombre.svg" alt="CardioConsult" style="width: 240px; height: auto; margin-left: -12px">
<div>
<h1 style="margin: 0 0 10px; font-size: 28px; font-weight: 800; line-height: 1.2">Créez l'espace de votre cabinet</h1>
<p style="margin: 0; color: #C3D1EA; line-height: 1.6">30 jours d'essai, données fictives de démonstration incluses.</p>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<li style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 12px"><span style="width: 30px; height: 30px; border-radius: 50%; background: #0F7A4D; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span><strong>Votre compte</strong><br><span style="font-size: 13px; color: #9FB3D9">Dr Claire Martin · e-mail vérifié</span></span></li>
<li style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 12px"><span style="width: 30px; height: 30px; border-radius: 50%; background: #0F7A4D; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span><strong>Cabinet & RPPS</strong><br><span style="font-size: 13px; color: #9FB3D9">RPPS vérifié via l'annuaire santé</span></span></li>
<li aria-current="step" style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 12px; background: #13305F"><span style="width: 30px; height: 30px; border-radius: 50%; background: #E0313B; display: flex; align-items: center; justify-content: center; font-weight: 800">3</span><span><strong>Votre espace</strong><br><span style="font-size: 13px; color: #C3D1EA">Sous-domaine et équipe</span></span></li>
<li style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 12px"><span style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid #3D5A8A; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #9FB3D9; box-sizing: border-box">4</span><span><strong style="color: #C3D1EA">Offre & essai</strong><br><span style="font-size: 13px; color: #9FB3D9">Aucun paiement aujourd'hui</span></span></li>
</ol>
<p style="margin: auto 0 0; font-size: 12.5px; color: #9FB3D9; line-height: 1.6">Chaque espace dispose d'une base de données isolée. Aucun autre cabinet ne peut accéder à vos patients.</p>
</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 56px 48px; box-sizing: border-box">
<div style="max-width: 760px; display: flex; flex-direction: column; gap: 28px">
<div>
<p style="margin: 0 0 6px; font-size: 13px; font-weight: 700; color: #52627F">Étape 3 sur 4</p>
<h2 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.5px">Choisissez l'adresse de votre espace</h2>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE4F2; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<label for="sub" style="font-weight: 700; font-size: 15px">Sous-domaine</label>
<div style="display: flex; align-items: stretch; border: 1.5px solid {{subBorder}}; border-radius: 12px; overflow: hidden">
<span style="padding: 14px 0 14px 16px; color: #52627F; font-size: 17px; background: #FFFFFF">https://</span>
<input id="sub" value="{{sub}}" onChange="{{onSub}}" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 80px; border: none; font: inherit; font-size: 17px; font-weight: 700; padding: 14px 4px; color: #0A1F44; outline: none">
<span style="padding: 14px 16px; color: #52627F; font-size: 17px; background: #F4F7FC; border-left: 1px solid #DCE4F2">.cardioconsult.fr</span>
</div>
<template data-if="available">
<p style="margin: 0; display: flex; gap: 8px; align-items: center; color: #0F7A4D; font-weight: 700; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>{{slug}}.cardioconsult.fr est disponible</p>
</template>
<template data-if="unavailable">
<p style="margin: 0; color: #B81E2A; font-weight: 700; font-size: 14px">{{message}}</p>
</template>
<p style="margin: 0; font-size: 13px; color: #52627F">3 à 30 caractères : lettres minuscules, chiffres et tirets. Modifiable plus tard par le support.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cab" style="font-weight: 700; font-size: 15px">Nom affiché du cabinet</label>
<input id="cab" value="Cabinet de cardiologie Martin" style="font: inherit; font-size: 16px; padding: 14px; border: 1.5px solid #C9D5EA; border-radius: 12px; color: #0A1F44">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="hds" style="font-weight: 700; font-size: 15px">Hébergement des données</label>
<input id="hds" value="France — hébergeur HDS" readonly style="font: inherit; font-size: 16px; padding: 14px; border: 1.5px solid #DCE4F2; border-radius: 12px; color: #52627F; background: #F4F7FC">
</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #DCE4F2; border-radius: 18px; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0; font-size: 17px; font-weight: 800">Rôles créés par défaut</h3>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<div style="border: 1px solid #E3E9F4; border-radius: 14px; padding: 16px"><div style="display: flex; justify-content: space-between"><strong>Médecin</strong><span style="font-size: 12px; font-weight: 700; color: #0B4FB3; background: #EAF1FD; padding: 3px 9px; border-radius: 999px">Vous · admin du cabinet</span></div><p style="margin: 8px 0 0; font-size: 14px; color: #3E4D6A; line-height: 1.5">Dossiers, consultations, validation et signature des comptes rendus et ordonnances.</p></div>
<div style="border: 1px solid #E3E9F4; border-radius: 14px; padding: 16px"><strong>Infirmière</strong><p style="margin: 8px 0 0; font-size: 14px; color: #3E4D6A; line-height: 1.5">Accueil, constantes, ECG, surveillance et transmissions. Pas de signature ni de prescription.</p></div>
</div>
<p style="margin: 0; font-size: 14px; color: #52627F">Vous inviterez votre équipe depuis Paramètres → Équipe & rôles.</p>
</div>

<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.55; color: #3E4D6A">
<input type="checkbox" checked style="width: 20px; height: 20px; margin-top: 1px; accent-color: #0B4FB3">
<span>J'accepte les <a href="#cab">CGU</a> et le <a href="#cab">contrat de sous-traitance (art. 28 RGPD)</a>. Je reste responsable du traitement des données de mes patients.</span>
</label>

<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<a href="01-site-public-cardioconsult-fr.html" style="font-weight: 700; color: #0A1F44; text-decoration: none; border: 1px solid #C9D5EA; background: #FFFFFF; border-radius: 12px; padding: 15px 22px">Retour</a>
<a href="04-tableau-de-bord-medecin.html" style="font-weight: 700; color: #FFFFFF; text-decoration: none; background: #0B4FB3; border-radius: 12px; padding: 15px 26px">Créer {{slug}}.cardioconsult.fr</a>
</div>
</div>
</main>
</div>
</template>
<div id="dc-app"></div>
<a href="index.html" style="position:fixed;right:16px;bottom:16px;z-index:50;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:#fff;background:#0A1F44;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 6px 18px rgba(10,31,68,.25)">← Tous les écrans</a>
<script id="dc-logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sub: 'dr-martin' };
  }
  renderVals() {
    var reserved = ['www', 'admin', 'app', 'api', 'cardio', 'support', 'demo'];
    var raw = this.state.sub || '';
    var slug = raw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    var message = '';
    if (slug.length < 3) message = 'Trop court : 3 caractères minimum.';
    else if (slug.length > 30) message = 'Trop long : 30 caractères maximum.';
    else if (reserved.indexOf(slug) !== -1) message = 'Adresse réservée par CardioConsult.';
    else if (slug === 'cabinet-cardio') message = 'Déjà utilisée par un autre cabinet.';
    var ok = message === '';
    return {
      sub: raw,
      slug: slug || 'votre-cabinet',
      available: ok,
      unavailable: !ok,
      message: message,
      subBorder: ok ? '#0F7A4D' : '#D42A35',
      onSub: (e) => this.setState({ sub: e.target.value })
    };
  }
}
</script>
<script>
/* Mini-runtime CardioConsult (export HTML autonome).
   Rend le gabarit <template id="dc-tpl"> avec la classe Component :
   {{trous}}, <template data-for>, <template data-if>, onClick / onChange. */
(function () {
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var patch = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, patch);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };
  DCLogic.prototype.renderVals = function () { return {}; };

  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(ANY, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventName(el, attr) {
    var n = attr.slice(2).toLowerCase();
    if (n === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio')) return 'input';
    }
    return n;
  }
  function procChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < kids.length; i++) proc(kids[i], scope);
  }
  function proc(node, scope) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') !== -1) node.nodeValue = interp(node.nodeValue, scope);
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-for')) {
      var list = lookup(node.getAttribute('data-for'), scope) || [];
      var as = node.getAttribute('data-as') || 'item';
      var frag = document.createDocumentFragment();
      for (var k = 0; k < list.length; k++) {
        var c = node.content.cloneNode(true);
        var s = Object.assign({}, scope); s[as] = list[k]; s.$index = k;
        procChildren(c, s);
        frag.appendChild(c);
      }
      node.parentNode.replaceChild(frag, node);
      return;
    }
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-if')) {
      if (lookup(node.getAttribute('data-if'), scope)) {
        var c2 = node.content.cloneNode(true);
        procChildren(c2, scope);
        node.parentNode.replaceChild(c2, node);
      } else {
        node.parentNode.removeChild(node);
      }
      return;
    }
    var attrs = Array.prototype.slice.call(node.attributes);
    for (var a = 0; a < attrs.length; a++) {
      var name = attrs[a].name, val = attrs[a].value;
      if (name.indexOf('hint-') === 0) { node.removeAttribute(name); continue; }
      if (name.indexOf('on') === 0) {
        node.removeAttribute(name);
        var m = val.match(WHOLE);
        var fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') node.addEventListener(eventName(node, name), fn);
        continue;
      }
      if (val.indexOf('{{') === -1) continue;
      var w = val.match(WHOLE);
      if (w) {
        var v = lookup(w[1], scope);
        if (typeof v === 'boolean') { if (v) node.setAttribute(name, ''); else node.removeAttribute(name); }
        else node.setAttribute(name, v == null ? '' : String(v));
      } else {
        node.setAttribute(name, interp(val, scope));
      }
    }
    procChildren(node, scope);
  }

  function boot() {
    var tpl = document.getElementById('dc-tpl');
    var app = document.getElementById('dc-app');
    var code = document.getElementById('dc-logic').textContent;
    var Component = new Function('DCLogic', code + '\n;return Component;')(DCLogic);
    var inst = new Component({});
    inst.__render = function () {
      var act = document.activeElement, id = act && act.id, s0 = null, s1 = null;
      try { s0 = act.selectionStart; s1 = act.selectionEnd; } catch (e) {}
      var frag = tpl.content.cloneNode(true);
      procChildren(frag, inst.renderVals() || {});
      app.replaceChildren(frag);
      if (id) {
        var el = document.getElementById(id);
        if (el) { el.focus(); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} }
      }
    };
    inst.__render();
    if (inst.componentDidMount) inst.componentDidMount();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
