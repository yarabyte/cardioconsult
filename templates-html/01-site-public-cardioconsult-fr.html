<div style="border: 1px solid #E3E9F4; border-radius: 16px; padding: 24px"><div style="font-size: 13px; font-weight: 800; color: #0B4FB3">05</div><h3 style="margin: 8px 0; font-size: 18px">Compte rendu & ordonnance</h3><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #3E4D6A">Aperçu A4, brouillon / validé / signé, modèles par motif, export PDF.</p></div>
