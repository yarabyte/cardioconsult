<script id="dc-logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ide: { 0: true, 1: true, 2: true, 3: true, 4: false, 5: false, 6: false, 7: false } }; }
  renderVals() {
    var self = this;
    var defs = [
      ['Voir les dossiers des patients du cabinet', false], ['Saisir constantes, ECG et surveillance', false], ['Gérer l’agenda et l’accueil', false],
      ['Rédiger des transmissions', false], ['Saisir ETT, scores et conclusions', false], ['Voir les statistiques du cabinet', false],
      ['Valider et signer un compte rendu', true], ['Rédiger et valider une ordonnance', true]
    ];
    var perms = defs.map(function (d, i) {
      var on = !!self.state.ide[i] && !d[1];
      return { label: d[0], locked: d[1], pressed: on ? 'true' : 'false', mark: on ? '✓' : '', bg: on ? '#0F7A4D' : (d[1] ? '#EEF2F8' : '#FFFFFF'), border: on ? '#0F7A4D' : '#C9D5EA',
        aria: d[0] + ' pour le rôle Infirmière',
        toggle: function () { if (d[1]) return; var n = Object.assign({}, self.state.ide); n[i] = !n[i]; self.setState({ ide: n }); } };
    });
    return { perms: perms };
  }
}
</script>

(function () {
  function DCLogic(props) { this.props = props || {}; this.state = {}; }

  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;

    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
