<script id="dc-logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: { C: 'non', H: 'oui', A2: 'non', D: 'non', S2: 'unk', V: 'oui', A: 'oui' } };
  }
  renderVals() {
    var self = this;
    var defs = [
      ['C', 'Insuffisance cardiaque / dysfonction VG', 1, 'Dossier : FEVG 61 % · aucun ATCD d’IC'],
      ['H', 'Hypertension artérielle', 1, 'Antécédents structurés'],
      ['A2', 'Âge ≥ 75 ans', 2, 'Calculé depuis la date de naissance (74 ans à l’acte)'],
      ['D', 'Diabète', 1, 'HbA1c 5,6 % · aucun traitement'],
      ['S2', 'AVC / AIT / embolie systémique', 2, 'Non documenté — à vérifier à l’interrogatoire'],
      ['V', 'Maladie vasculaire (IDM, AOMI, plaque aortique)', 1, 'AOMI stade II'],
      ['A', 'Âge 65–74 ans', 1, 'Calculé depuis la date de naissance']
    ];
    var v = this.state.v;
    var min = 0, max = 0, miss = [], pos = [];
    var on = ['#0B4FB3', '#FFFFFF'], off = ['transparent', '#3E4D6A'], unkOn = ['#B45309', '#FFFFFF'];
    var items = defs.map(function (d) {
      var k = d[0], s = v[k];
      if (s === 'oui') { min += d[2]; max += d[2]; pos.push(d[1] + ' (+' + d[2] + ')'); }
      if (s === 'unk') { max += d[2]; miss.push(d[1]); }
      var set = function (val) { return function () { var nv = Object.assign({}, self.state.v); nv[k] = val; self.setState({ v: nv }); }; };
      var a = s === 'oui' ? on : off, b = s === 'non' ? on : off, c = s === 'unk' ? unkOn : off;
      return { label: d[1], pts: d[2], src: d[3], yes: set('oui'), no: set('non'), unk: set('unk'),
        pYes: s === 'oui' ? 'true' : 'false', pNo: s === 'non' ? 'true' : 'false', pUnk: s === 'unk' ? 'true' : 'false',
        bgYes: a[0], fgYes: a[1], bgNo: b[0], fgNo: b[1], bgUnk: c[0], fgUnk: c[1] };
    });
    var complete = miss.length === 0;
    return {
      items: items,
      resValue: complete ? String(min) : (min + ' à ' + max),
      resLabel: complete ? 'Calculé · à interpréter par le médecin' : 'Incomplet — calcul partiel',
      resColor: complete ? '#0B4FB3' : '#B45309',
      why: pos.length ? pos.join(' · ') : 'Aucun critère positif renseigné.',
      missing: complete ? 'Aucune' : miss.join(' · '),
      missColor: complete ? '#0F7A4D' : '#B45309'
    };
  }
}
</script>
<script>
/* Mini-runtime CardioConsult (export HTML autonome).
   Rend le gabarit <template id="dc-tpl"> avec la classe Component :
   {{trous}}, <template data-for>, <template data-if>, onClick / onChange. */
(function () {
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var patch = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, patch);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };
  DCLogic.prototype.renderVals = function () { return {}; };

  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(ANY, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventName(el, attr) {
    var n = attr.slice(2).toLowerCase();
    if (n === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio')) return 'input';
    }
    return n;
  }
  function procChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < kids.length; i++) proc(kids[i], scope);
  }
  function proc(node, scope) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') !== -1) node.nodeValue = interp(node.nodeValue, scope);
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-for')) {
      var list = lookup(node.getAttribute('data-for'), scope) || [];
      var as = node.getAttribute('data-as') || 'item';
      var frag = document.createDocumentFragment();
      for (var k = 0; k < list.length; k++) {
        var c = node.content.cloneNode(true);
        var s = Object.assign({}, scope); s[as] = list[k]; s.$index = k;
        procChildren(c, s);
