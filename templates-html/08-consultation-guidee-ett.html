<script>
/* Mini-runtime CardioConsult (export HTML autonome).
   Rend le gabarit <template id="dc-tpl"> avec la classe Component :
   {{trous}}, <template data-for>, <template data-if>, onClick / onChange. */
(function () {
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var patch = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, patch);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };
  DCLogic.prototype.renderVals = function () { return {}; };

  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(ANY, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventName(el, attr) {
    var n = attr.slice(2).toLowerCase();
    if (n === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio')) return 'input';
    }
    return n;
  }
  function procChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < kids.length; i++) proc(kids[i], scope);
  }
  function proc(node, scope) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') !== -1) node.nodeValue = interp(node.nodeValue, scope);
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-for')) {
      var list = lookup(node.getAttribute('data-for'), scope) || [];
      var as = node.getAttribute('data-as') || 'item';
      var frag = document.createDocumentFragment();
      for (var k = 0; k < list.length; k++) {
        var c = node.content.cloneNode(true);
        var s = Object.assign({}, scope); s[as] = list[k]; s.$index = k;
        procChildren(c, s);
        frag.appendChild(c);
      }
      node.parentNode.replaceChild(frag, node);
      return;
    }
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-if')) {
      if (lookup(node.getAttribute('data-if'), scope)) {
        var c2 = node.content.cloneNode(true);
        procChildren(c2, scope);
        node.parentNode.replaceChild(c2, node);
      } else {
        node.parentNode.removeChild(node);
      }
      return;
    }
    var attrs = Array.prototype.slice.call(node.attributes);
    for (var a = 0; a < attrs.length; a++) {
      var name = attrs[a].name, val = attrs[a].value;
      if (name.indexOf('hint-') === 0) { node.removeAttribute(name); continue; }
      if (name.indexOf('on') === 0) {
        node.removeAttribute(name);
        var m = val.match(WHOLE);
        var fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') node.addEventListener(eventName(node, name), fn);
        continue;
      }
      if (val.indexOf('{{') === -1) continue;
      var w = val.match(WHOLE);
      if (w) {
        var v = lookup(w[1], scope);
        if (typeof v === 'boolean') { if (v) node.setAttribute(name, ''); else node.removeAttribute(name); }
        else node.setAttribute(name, v == null ? '' : String(v));
      } else {
        node.setAttribute(name, interp(val, scope));
      }
    }
    procChildren(node, scope);
  }

  function boot() {
    var tpl = document.getElementById('dc-tpl');
    var app = document.getElementById('dc-app');
    var code = document.getElementById('dc-logic').textContent;
    var Component = new Function('DCLogic', code + '\n;return Component;')(DCLogic);
    var inst = new Component({});
    inst.__render = function () {
      var act = document.activeElement, id = act && act.id, s0 = null, s1 = null;
      try { s0 = act.selectionStart; s1 = act.selectionEnd; } catch (e) {}
      var frag = tpl.content.cloneNode(true);
      procChildren(frag, inst.renderVals() || {});
      app.replaceChildren(frag);
      if (id) {
        var el = document.getElementById(id);
        if (el) { el.focus(); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} }
      }
    };
    inst.__render();
    if (inst.componentDidMount) inst.componentDidMount();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
