<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — espace cabinet — CardioConsult (template)</title>
<link rel="icon" href="assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FC;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0A1F44}
a{color:#0B4FB3}a:hover{color:#083A85}
input:focus,button:focus-visible{outline:3px solid #9DBCF0;outline-offset:1px}
</style>
</head>
<body>
<template id="dc-tpl">

<div style="min-height: 880px; display: flex; flex-wrap: wrap; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0A1F44; background: #F4F7FC">

<main style="flex: 1 1 520px; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box">
<div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 24px">
<img src="assets/logo-clair.svg" alt="CardioConsult" style="width: 230px; height: auto; margin-left: -8px">
<div style="display: flex; align-items: center; gap: 10px; background: #EAF1FD; border-radius: 12px; padding: 12px 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B4FB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>
<div style="font-size: 14px"><strong>Cabinet de cardiologie Martin</strong><br><span style="color: #3E4D6A">dr-martin.cardioconsult.fr</span></div>
</div>

<template data-if="stepLogin">
<div style="display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Connexion</h1>
<button type="button" style="font: inherit; font-size: 15px; font-weight: 700; color: #0A1F44; background: #FFFFFF; border: 1.5px solid #C9D5EA; border-radius: 12px; padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B4FB3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>
Se connecter avec Pro Santé Connect (e-CPS)</button>
<div style="display: flex; align-items: center; gap: 12px; color: #52627F; font-size: 13px"><span style="flex: 1; height: 1px; background: #DCE4F2"></span>ou avec votre e-mail<span style="flex: 1; height: 1px; background: #DCE4F2"></span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mail" style="font-weight: 700; font-size: 14px">Adresse e-mail professionnelle</label>
<input id="mail" type="email" value="c.martin@cabinet-martin.fr" style="font: inherit; font-size: 16px; padding: 14px; border: 1.5px solid #C9D5EA; border-radius: 12px; color: #0A1F44">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><label for="pwd" style="font-weight: 700; font-size: 14px">Mot de passe</label><a href="#mail" style="font-size: 14px; font-weight: 600">Mot de passe oublié ?</a></div>
<input id="pwd" type="password" value="motdepasse-demo" style="font: inherit; font-size: 16px; padding: 14px; border: 1.5px solid #C9D5EA; border-radius: 12px; color: #0A1F44">
</div>
<button type="button" onClick="{{next}}" style="font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; background: #0B4FB3; border: none; border-radius: 12px; padding: 16px; cursor: pointer">Continuer</button>
</div>
</template>

<template data-if="stepMfa">
<div style="display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Vérification en deux étapes</h1>
<p style="margin: 0; color: #3E4D6A; line-height: 1.6">Saisissez le code à 6 chiffres de votre application d'authentification.</p>
<label for="code" style="font-weight: 700; font-size: 14px">Code de vérification</label>
<input id="code" inputmode="numeric" value="482 913" style="font: inherit; font-size: 28px; font-weight: 800; letter-spacing: 10px; text-align: center; padding: 16px; border: 1.5px solid #0B4FB3; border-radius: 12px; color: #0A1F44">
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; color: #3E4D6A"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #0B4FB3">Faire confiance à ce poste pendant 12 h</label>
<a href="04-tableau-de-bord-medecin.html" style="text-align: center; font-size: 16px; font-weight: 700; color: #FFFFFF; background: #0B4FB3; border-radius: 12px; padding: 16px; text-decoration: none">Accéder à mon espace</a>
<button type="button" onClick="{{back}}" style="font: inherit; font-size: 14px; font-weight: 700; color: #0B4FB3; background: none; border: none; padding: 10px; cursor: pointer">Revenir à la connexion</button>
</div>
</template>

<p style="margin: 0; font-size: 12.5px; color: #52627F; line-height: 1.6">Session verrouillée automatiquement après 15 min d'inactivité. Chaque connexion est inscrite au journal d'audit du cabinet.</p>
</div>
</main>

<aside style="flex: 1 1 520px; min-width: 0; background: #0A1F44; color: #FFFFFF; padding: 64px 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 28px">
<p style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; color: #FF6B73; text-transform: uppercase">Aujourd'hui au cabinet</p>
<h2 style="margin: 0; font-size: 36px; font-weight: 800; line-height: 1.2; letter-spacing: -0.6px">14 consultations, 3 ETT, 2 comptes rendus à valider.</h2>
<div style="background: #13305F; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #C3D1EA">08:30 · Suivi IC</span><span style="font-weight: 700">J. Dupont</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #C3D1EA">09:00 · ETT de contrôle</span><span style="font-weight: 700">R. Lefèvre</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #C3D1EA">09:30 · Bilan préopératoire</span><span style="font-weight: 700">M. Benali</span></div>
<p style="margin: 0; font-size: 12px; color: #9FB3D9">Patients fictifs — aperçu visible uniquement après connexion.</p>
</div>
</aside>
</div>
</template>
<div id="dc-app"></div>
<a href="index.html" style="position:fixed;right:16px;bottom:16px;z-index:50;font:700 13px 'Plus Jakarta Sans',system-ui,sans-serif;color:#fff;background:#0A1F44;padding:10px 14px;border-radius:999px;text-decoration:none;box-shadow:0 6px 18px rgba(10,31,68,.25)">← Tous les écrans</a>
<script id="dc-logic" type="text/plain">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 'login' }; }
  renderVals() {
    return {
      stepLogin: this.state.step === 'login',
      stepMfa: this.state.step === 'mfa',
      next: () => this.setState({ step: 'mfa' }),
      back: () => this.setState({ step: 'login' })
    };
  }
}
</script>
<script>
/* Mini-runtime CardioConsult (export HTML autonome).
   Rend le gabarit <template id="dc-tpl"> avec la classe Component :
   {{trous}}, <template data-for>, <template data-if>, onClick / onChange. */
(function () {
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var patch = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, patch);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () { if (this.__render) this.__render(); };
  DCLogic.prototype.renderVals = function () { return {}; };

  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }
  function interp(str, scope) {
    return str.replace(ANY, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventName(el, attr) {
    var n = attr.slice(2).toLowerCase();
    if (n === 'change') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      if (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio')) return 'input';
    }
    return n;
  }
  function procChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < kids.length; i++) proc(kids[i], scope);
  }
  function proc(node, scope) {
    if (node.nodeType === 3) {
      if (node.nodeValue.indexOf('{{') !== -1) node.nodeValue = interp(node.nodeValue, scope);
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-for')) {
      var list = lookup(node.getAttribute('data-for'), scope) || [];
      var as = node.getAttribute('data-as') || 'item';
      var frag = document.createDocumentFragment();
      for (var k = 0; k < list.length; k++) {
        var c = node.content.cloneNode(true);
        var s = Object.assign({}, scope); s[as] = list[k]; s.$index = k;
        procChildren(c, s);
        frag.appendChild(c);
      }
      node.parentNode.replaceChild(frag, node);
      return;
    }
    if (node.tagName === 'TEMPLATE' && node.hasAttribute('data-if')) {
      if (lookup(node.getAttribute('data-if'), scope)) {
        var c2 = node.content.cloneNode(true);
        procChildren(c2, scope);
        node.parentNode.replaceChild(c2, node);
      } else {
        node.parentNode.removeChild(node);
      }
      return;
    }
    var attrs = Array.prototype.slice.call(node.attributes);
    for (var a = 0; a < attrs.length; a++) {
      var name = attrs[a].name, val = attrs[a].value;
      if (name.indexOf('hint-') === 0) { node.removeAttribute(name); continue; }
      if (name.indexOf('on') === 0) {
        node.removeAttribute(name);
        var m = val.match(WHOLE);
        var fn = m ? lookup(m[1], scope) : null;
        if (typeof fn === 'function') node.addEventListener(eventName(node, name), fn);
        continue;
      }
      if (val.indexOf('{{') === -1) continue;
      var w = val.match(WHOLE);
      if (w) {
        var v = lookup(w[1], scope);
        if (typeof v === 'boolean') { if (v) node.setAttribute(name, ''); else node.removeAttribute(name); }
        else node.setAttribute(name, v == null ? '' : String(v));
      } else {
        node.setAttribute(name, interp(val, scope));
      }
    }
    procChildren(node, scope);
  }

  function boot() {
    var tpl = document.getElementById('dc-tpl');
    var app = document.getElementById('dc-app');
    var code = document.getElementById('dc-logic').textContent;
    var Component = new Function('DCLogic', code + '\n;return Component;')(DCLogic);
    var inst = new Component({});
    inst.__render = function () {
      var act = document.activeElement, id = act && act.id, s0 = null, s1 = null;
      try { s0 = act.selectionStart; s1 = act.selectionEnd; } catch (e) {}
      var frag = tpl.content.cloneNode(true);
      procChildren(frag, inst.renderVals() || {});
      app.replaceChildren(frag);
      if (id) {
        var el = document.getElementById(id);
        if (el) { el.focus(); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} }
      }
    };
    inst.__render();
    if (inst.componentDidMount) inst.componentDidMount();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
