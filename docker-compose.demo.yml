# Stack démo / préprod — install directe sur Lightsail (sans Coolify).
# Données synthétiques uniquement. Hors HDS.
# Doc : docs/exploitation/mise-en-ligne-demo-lightsail.md
#
# Minimal (2 Go RAM) :
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build
# Extras (MinIO / Gotenberg / ClamAV) :
#   docker compose -f docker-compose.demo.yml --env-file .env.demo --profile extras up -d --build

name: cardiosoins-demo

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-noreply@cardiosoins.com}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - demo_caddy_data:/data
      - demo_caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardioconsult}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-cc_control}
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardioconsult} -d ${POSTGRES_DB:-cc_control}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m

  minio:
    profiles: ["extras"]
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
    volumes:
      - demo_minio_data:/data
    mem_limit: 192m

  minio-init:
    profiles: ["extras"]
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${S3_BUCKET:-cardiosoins-demo} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD requis}
      S3_BUCKET: ${S3_BUCKET:-cardiosoins-demo}

  gotenberg:
    profiles: ["extras"]
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 512m

  clamav:
    profiles: ["extras"]
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - demo_clamav_data:/var/lib/clamav
    mem_limit: 768m

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_ENV: production
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-cardiosoins.com}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://127.0.0.1:9000}
      S3_REGION: ${S3_REGION:-eu-north-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-cardiosoins-demo}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://127.0.0.1:3001}
      CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      APP_SECRET: ${APP_SECRET}
      CRYPTO_KEY_MANAGER: ${CRYPTO_KEY_MANAGER:-local-dev}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://cardiosoins.com}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-cardiosoins.com}
      NEXT_PUBLIC_APP_ENV: production
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@cardiosoins.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONSOLE_REQUIRE_PASSKEY: ${CONSOLE_REQUIRE_PASSKEY:-true}
      CONSOLE_IP_ALLOWLIST: ${CONSOLE_IP_ALLOWLIST:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: 512m

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    restart: unless-stopped
    command: ["pnpm", "jobs:work"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://127.0.0.1:9000}
      S3_REGION: ${S3_REGION:-eu-north-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-cardiosoins-demo}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://127.0.0.1:3001}
      CLAMAV_HOST: ${CLAMAV_HOST:-127.0.0.1}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      APP_SECRET: ${APP_SECRET}
      CRYPTO_KEY_MANAGER: ${CRYPTO_KEY_MANAGER:-local-dev}
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-noreply@cardiosoins.com}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    mem_limit: 384m

  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    profiles: ["tools"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL}
      APP_SECRET: ${APP_SECRET}
      CRYPTO_KEY_MANAGER: ${CRYPTO_KEY_MANAGER:-local-dev}
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-cardiosoins.com}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  demo_pg_data:
  demo_caddy_data:
  demo_caddy_config:
  demo_minio_data:
  demo_clamav_data:
