name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · types · tests · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardioconsult
          POSTGRES_PASSWORD: cardioconsult
          POSTGRES_DB: cc_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardioconsult -d cc_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cardioconsult:cardioconsult@127.0.0.1:5432/cc_control
      DATABASE_ADMIN_URL: postgresql://cardioconsult:cardioconsult@127.0.0.1:5432/cc_control
      APP_SECRET: ci-test-secret-32-characters-min!!
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Disable Next.js telemetry
        run: pnpm exec next telemetry disable

      - name: Migrate control-plane
        run: pnpm db:migrate:control

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Audit (high+)
        run: pnpm audit --audit-level=high

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep OWASP / Next.js
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep \
            semgrep scan --config p/owasp-top-ten --config p/nextjs \
            --error --quiet

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E security headers
        run: pnpm test:e2e
        env:
          CI: true

  container-scan:
    name: Trivy FS + image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cardioconsult:ci
      - name: Trivy image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cardioconsult:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
